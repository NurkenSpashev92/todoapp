root = "."
tmp_dir = "out/tmp"

[build]
  cmd = "go build -o ./out/tmp/todoapp ./cmd/todoapp"
  bin = "./out/tmp/todoapp"
  include_ext = ["go"]
  exclude_dir = ["out", "migrations", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  # Docker Desktop on macOS doesn't reliably forward fs events from bind mounts
  poll = true
  poll_interval = 500
  send_interrupt = true
  kill_delay = "5s"
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
