services:
  todo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo
    working_dir: /app
    command: air -c .air.toml
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgresql_todo
    depends_on:
      postgresql_todo:
        condition: service_healthy
    ports:
      - "8080:8080"

  postgresql_todo:
    image: postgres:18.4-alpine
    container_name: postgresql_todo
    env_file:
      - .env
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"

  todo-migrate:
    image: migrate/migrate:v4.19.1
    env_file:
      - .env
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    depends_on:
      postgresql_todo:
        condition: service_healthy
